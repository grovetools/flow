name = "flow"
description = "Job orchestration and workflows"
managed = true

[binary]
name = "flow"
path = "./bin/flow"

[context]
default_rules = "dev-no-tests"

[[test_scopes]]
name = "anchor-registry"
rules = ".cx/anchor-registry.rules"
scenarios = ["anchor-registry", "anchor-registry-multi", "anchor-registry-reap-stub"]

[[test_scopes]]
name = "at-target"
rules = ".cx/at-target.rules"
scenarios = ["at-target", "coordinator-workflow"]

[[test_scopes]]
name = "claude-trust-preseed"
rules = ".cx/claude-trust-preseed.rules"
scenarios = ["coordinator-workflow"]

[[test_scopes]]
name = "claude-settings-sync"
rules = ".cx/claude-settings-sync.rules"
scenarios = ["claude-settings-sync"]

[[test_scopes]]
name = "claude-settings-grove-cascade"
rules = ".cx/claude-settings-grove-cascade.rules"
scenarios = ["claude-settings-grove-cascade"]

[[test_scopes]]
name = "claude-settings-member-union"
rules = ".cx/claude-settings-member-union.rules"
scenarios = ["claude-settings-member-union"]

[[test_scopes]]
name = "claude-settings-no-clobber"
rules = ".cx/claude-settings-no-clobber.rules"
scenarios = ["claude-settings-no-clobber"]

[[hooks.on_stop]]
name = "Auto-format"
command = "make fmt; CODE=$?; grove internal task-report . fmt $CODE; exit $CODE"
run_if = "changes"

[[hooks.on_stop]]
name = "Validation & Smart E2E"
command = "make check; CODE=$?; grove internal task-report . check $CODE; if [ $CODE -eq 0 ]; then grove internal test-smart --skip-tags=slow; fi"
run_if = "changes"
cancel_previous = true
timeout = 300

[[hooks.post_tool_use]]
name = "concept-reminder"
if = "Bash(git commit *)"
additional_context = """
You just committed. If these changes affected architecture, behavior, or
public interfaces, invoke the concept-maintainer skill to update or add
concept docs. Skip if this was a trivial fix or docs-only change.
"""


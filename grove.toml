name = "flow"
description = "Job orchestration and workflows"
managed = true

[binary]
name = "flow"
path = "./bin/flow"

[context]
default_rules = "dev-no-tests"

[[test_scopes]]
name = "strip-comments"
rules = ".cx/strip-comments.rules"
scenarios = ["oneshot-strip-comments", "chat-strip-comments"]

[[test_scopes]]
name = "anchor-registry"
rules = ".cx/anchor-registry.rules"
scenarios = ["anchor-registry", "anchor-registry-multi", "anchor-registry-reap-stub"]

[[test_scopes]]
name = "at-target"
rules = ".cx/at-target.rules"
scenarios = ["at-target", "coordinator-workflow"]

[[test_scopes]]
name = "claude-trust-preseed"
rules = ".cx/claude-trust-preseed.rules"
scenarios = ["coordinator-workflow", "claude-trust-seed"]

[[test_scopes]]
name = "claude-settings-sync"
rules = ".cx/claude-settings-sync.rules"
scenarios = ["claude-settings-sync"]

[[test_scopes]]
name = "claude-settings-grove-cascade"
rules = ".cx/claude-settings-grove-cascade.rules"
scenarios = ["claude-settings-grove-cascade"]

[[test_scopes]]
name = "claude-settings-member-union"
rules = ".cx/claude-settings-member-union.rules"
scenarios = ["claude-settings-member-union"]

[[test_scopes]]
name = "claude-settings-no-clobber"
rules = ".cx/claude-settings-no-clobber.rules"
scenarios = ["claude-settings-no-clobber"]

[[test_scopes]]
name = "agent-provider"
rules = ".cx/agent-provider.rules"
scenarios = ["claude-provider-lifecycle", "claude-provider-args", "codex-provider-lifecycle", "codex-provider-args", "opencode-provider-lifecycle", "opencode-provider-args", "pi-provider-lifecycle", "pi-provider-args", "per-job-provider-override", "mixed-provider-plan"]

[[test_scopes]]
name = "agent-provider-lifecycle"
rules = ".cx/agent-provider.rules"
scenarios = ["codex-outcome-lifecycle", "pi-outcome-lifecycle", "opencode-outcome-lifecycle", "codex-nested-session-discovery", "pi-headless-launch", "codex-headless-unsupported", "pi-session-registration", "pi-interactive-non-tty"]

[[test_scopes]]
name = "oracle-cache-lineage"
rules = ".cx/oracle-cache-lineage.rules"
scenarios = [
  "layer0-creation",
  "byte-immutability",
  "rules-widening",
  "widening-dedup",
  "worktree-edit-frozen",
  "append-delta",
  "rebase",
  "rules-removal",
  "rebase-advisory",
  "lineage-inherit",
  "dep-transcript-layer",
  "git-delta-on-lineage",
  "lineage-model-mismatch",
  "pinned-context-rejected",
  "cache-ttl-frontmatter",
  "no-cache",
  "transcript-stability",
  "chat-reopen",
  "snapshot-optout",
  "gemini-passthrough",
  "concurrent-chats",
  "unreadable-glob-file",
  "legacy-untouched",
  "lineage-overlap-advisor",
]

[[hooks.on_stop]]
name = "Auto-format"
command = "make fmt; CODE=$?; grove internal task-report . fmt $CODE; exit $CODE"
run_if = "changes"

[[hooks.on_stop]]
name = "Validation & Smart E2E"
command = "make check; CODE=$?; grove internal task-report . check $CODE; if [ $CODE -eq 0 ]; then grove internal test-smart --skip-tags=slow; fi"
run_if = "changes"
cancel_previous = true
timeout = 300

[[hooks.post_tool_use]]
name = "concept-reminder"
if = "Bash(git commit *)"
additional_context = """
You just committed. If these changes affected architecture, behavior, or
public interfaces, invoke the concept-maintainer skill to update or add
concept docs. Skip if this was a trivial fix or docs-only change.
"""

